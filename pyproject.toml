[project]
name = "spain-electricity"
version = "0.1.0"
description = "Spark ML and Structured Streaming analysis of Spain's electricity demand, generation mix and price (REE, Open-Meteo, MIBGAS)."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pyspark[ml,sql]>=4.2.1,<4.3",
    "matplotlib>=3.9",
    "openpyxl>=3.1",
    "requests>=2.32",
    "pandas>=2.2,<3",
    "streamlit>=1.67.0",
]

[dependency-groups]
dev = [
    "ipykernel>=6.29",
    "pytest>=8.3",
    "ruff>=0.8",
]

[build-system]
requires = ["uv_build>=0.11.22,<0.12"]
build-backend = "uv_build"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
markers = [
    "integration: end-to-end tests that run a local Spark job (slower)",
]

[tool.ruff]
line-length = 110
target-version = "py311"
extend-exclude = ["docs/superpowers"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP", "D"]

[tool.ruff.lint.pydocstyle]
convention = "pep257"

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["D"]
